<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunny Bus Pick-Up!</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 14px;
            background: linear-gradient(160deg, #bae6fd 0%, #fef9c3 55%, #bbf7d0 100%);
            font-family: "Nunito", "Comic Sans MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            width: 420px;
            height: 600px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 78px);
            aspect-ratio: 420 / 600;
            border: 4px solid #ffffff;
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22), 0 0 0 2px #f59e0b;
            cursor: pointer;
            touch-action: none;
            -webkit-touch-callout: none;
            display: block;
        }
        .controls-hint {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            background: rgba(255, 255, 255, 0.78);
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
        .controls-hint kbd {
            background: #fbbf24;
            color: #1e293b;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            border: 1.5px solid #d97706;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="420" height="600"></canvas>
        <div class="controls-hint">
            Tap or press <kbd>Space</kbd> / <kbd>↑</kbd> to <strong>Hop</strong> (Tap twice to <strong>Double Hop!</strong>) &middot; <kbd>M</kbd> Sound
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
