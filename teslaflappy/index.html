<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Flappy Bird</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        canvas {
            width: 400px;
            height: 600px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 80px);
            aspect-ratio: 2 / 3;
            border: 3px solid #334155;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
            cursor: pointer;
            touch-action: manipulation;
            display: block;
        }
        .controls-hint {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }
        .controls-hint kbd {
            background: #334155;
            color: #f8fafc;
            padding: 2px 7px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="controls-hint">
            <kbd>Space</kbd> / <kbd>↑</kbd> or <strong>Click / Tap</strong> to Fly &middot; <kbd>M</kbd> Mute Sound
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
