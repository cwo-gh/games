<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>CWO Games</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
        --bg: #020617;
        --panel: #0f172a;
        --line: #334155;
        --accent: #38bdf8;
        --text: #f8fafc;
        --muted: #94a3b8;
        color-scheme: dark;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    body.playing { overflow: hidden; }

    button { font: inherit; color: inherit; }

    .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
            radial-gradient(circle, rgba(255, 255, 255, 0.6) 1px, transparent 1.6px),
            radial-gradient(circle, rgba(148, 163, 184, 0.5) 1px, transparent 1.6px);
        background-size: 120px 120px, 190px 190px;
        background-position: 0 0, 40px 70px;
        opacity: 0.16;
        -webkit-mask-image: linear-gradient(#000, transparent 78%);
        mask-image: linear-gradient(#000, transparent 78%);
    }

    .home {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(28px, 5vw, 44px);
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 760px;
        margin: 0 auto;
        padding: clamp(24px, 6vw, 56px) clamp(16px, 4vw, 28px);
    }

    .hero { text-align: center; }

    h1 {
        margin: 0;
        font-size: clamp(2.9rem, 10vw, 5rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        line-height: 1;
        text-transform: uppercase;
        text-shadow: 0 0 40px rgba(56, 189, 248, 0.22);
    }

    .hero::after {
        content: "";
        display: block;
        width: 52px;
        height: 3px;
        margin: 20px auto 0;
        border-radius: 2px;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }

    @media (min-width: 620px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }

    .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        min-height: 84px;
        padding: 18px 22px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.68), rgba(15, 23, 42, 0.9));
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .card:nth-child(1) { animation-delay: 0.04s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.16s; }
    .card:nth-child(4) { animation-delay: 0.22s; }

    .card:hover {
        border-color: var(--accent);
        box-shadow:
            0 0 0 1px rgba(56, 189, 248, 0.3),
            0 0 28px rgba(56, 189, 248, 0.22),
            0 16px 34px rgba(0, 0, 0, 0.5);
    }

    .card:active { transform: scale(0.995); }

    .card:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35);
    }

    @media (hover: hover) {
        .card:hover { transform: translateY(-2px); }
    }

    .name {
        font-size: clamp(1.1rem, 2.4vw, 1.3rem);
        font-weight: 700;
        letter-spacing: -0.015em;
    }

    .score {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        flex: none;
        line-height: 1;
    }

    .score-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .score-value {
        font-size: 1.05rem;
        font-weight: 800;
        color: #e0f2fe;
        font-variant-numeric: tabular-nums;
    }

    .foot {
        text-align: center;
        color: #64748b;
        font-size: 12px;
        letter-spacing: 0.02em;
    }

    /* ---------- Player overlay ---------- */

    .player {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
        opacity: 0;
        visibility: hidden;
        transform: scale(1.01);
        transition: opacity 0.28s ease, visibility 0.28s, transform 0.28s ease;
    }

    .player.open {
        opacity: 1;
        visibility: visible;
        transform: none;
    }

    .player-bar {
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        padding:
            calc(10px + env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            10px
            max(12px, env(safe-area-inset-left));
        border-bottom: 1px solid rgba(51, 65, 85, 0.7);
        background: rgba(2, 6, 23, 0.8);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: none;
        padding: 9px 14px 9px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.7);
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .back-btn:hover { border-color: var(--accent); color: #fff; }

    .back-btn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .player-meta {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
    }

    .player-meta .live {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: glow 2s infinite;
    }

    #playerTitle {
        font-size: 13.5px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bar-actions { display: flex; flex: none; gap: 6px; }

    .icon-btn {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: rgba(15, 23, 42, 0.7);
        color: #cbd5e1;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, color 0.2s;
        -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:hover { border-color: var(--accent); color: #fff; }

    .icon-btn:focus-visible, .back-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--accent);
    }

    .icon-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        padding:
            10px
            max(10px, env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
    }

    .frame-shell {
        position: relative;
        flex: 1;
        min-height: 0;
        max-width: 1000px;
        margin: 0 auto;
        overflow: hidden;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--bg);
        box-shadow:
            0 24px 60px rgba(0, 0, 0, 0.75),
            0 0 30px rgba(56, 189, 248, 0.12);
    }

    #gameFrame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .frame-shell.loaded #gameFrame { opacity: 1; }

    .loader {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.04em;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .frame-shell.loaded .loader { opacity: 0; }

    .spinner {
        width: 34px;
        height: 34px;
        border: 2.5px solid rgba(148, 163, 184, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
    }

    @keyframes glow {
        50% { box-shadow: 0 0 4px var(--accent); }
    }

    @media (max-width: 619px) {
        .card { min-height: 76px; padding: 16px 18px; }
        .home { gap: 26px; }
        .hero::after { margin-top: 16px; }
    }

    @media (max-width: 400px) {
        .back-btn span { display: none; }
        .back-btn { padding: 9px 11px; }
        #playerTitle { font-size: 12.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
    }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="home" id="home">
    <header class="hero">
        <h1>CWO Games</h1>
    </header>

    <section class="grid" id="gameGrid" aria-label="Games"></section>

    <footer class="foot">Best scores are saved on this device</footer>
</main>

<section class="player" id="player" role="dialog" aria-modal="true" aria-label="Game player" aria-hidden="true">
    <div class="player-bar">
        <button class="back-btn" id="backBtn" type="button" aria-label="Back to all games">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span>All games</span>
        </button>
        <div class="player-meta">
            <span class="live" aria-hidden="true"></span>
            <span id="playerTitle">Game</span>
        </div>
        <div class="bar-actions">
            <button class="icon-btn" id="restartBtn" type="button" aria-label="Restart game" title="Restart game">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            </button>
            <button class="icon-btn" id="fullBtn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
            </button>
        </div>
    </div>
    <div class="stage" id="stage">
        <div class="frame-shell" id="frameShell">
            <div class="loader" id="loader" aria-hidden="true">
                <span class="spinner"></span>
                <span>Loading game&hellip;</span>
            </div>
        </div>
    </div>
</section>

<script>
(function () {
    "use strict";

    var GAMES = JSON.parse(document.getElementById("gameData").textContent);

    var home = document.getElementById("home");
    var grid = document.getElementById("gameGrid");
    var player = document.getElementById("player");
    var frameShell = document.getElementById("frameShell");
    var playerTitle = document.getElementById("playerTitle");
    var backBtn = document.getElementById("backBtn");
    var restartBtn = document.getElementById("restartBtn");
    var fullBtn = document.getElementById("fullBtn");

    var activeIndex = -1;
    var lastFocus = null;
    var bestEls = [];
    var frame = null;

    function readBest(game) {
        try {
            var raw = localStorage.getItem(game.bestKey);
            if (raw === null || raw === "") return null;
            var n = Number(raw);
            return isFinite(n) && n > 0 ? n : null;
        } catch (err) {
            return null;
        }
    }

    function formatBest(game, best) {
        if (best === null) return "\u2014";
        return game.bestUnit === "s" ? best.toFixed(2) + "s" : String(Math.round(best));
    }

    function refreshBest(i) {
        var el = bestEls[i];
        if (!el) return;
        el.textContent = formatBest(GAMES[i], readBest(GAMES[i]));
    }

    GAMES.forEach(function (game, i) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card";
        btn.dataset.game = String(i);
        btn.innerHTML =
            '<span class="name">' + game.title + "</span>" +
            '<span class="score"><span class="score-label">Best</span><span class="score-value">\u2014</span></span>';

        bestEls[i] = btn.querySelector(".score-value");
        refreshBest(i);

        btn.addEventListener("click", function () { openGame(i); });
        grid.appendChild(btn);
    });

    function decodeBase64(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder("utf-8").decode(bytes);
    }

    function destroyFrame() {
        if (frame) {
            frame.setAttribute("src", "about:blank");
            frame.remove();
            frame = null;
        }
    }

    function openGame(i) {
        var game = GAMES[i];
        if (!game) return;

        if (activeIndex === -1) lastFocus = document.activeElement;

        activeIndex = i;
        playerTitle.textContent = game.title;
        frameShell.classList.remove("loaded");
        destroyFrame();

        var next = document.createElement("iframe");
        next.id = "gameFrame";
        next.title = game.title + " game";
        next.setAttribute("allow", "autoplay; fullscreen; gamepad");
        next.setAttribute("scrolling", "no");
        next.addEventListener("load", function () {
            frameShell.classList.add("loaded");
            try { next.contentWindow.focus(); } catch (err) { /* ignore */ }
        });
        next.srcdoc = decodeBase64(game.html);
        frameShell.appendChild(next);
        frame = next;

        player.classList.add("open");
        player.setAttribute("aria-hidden", "false");
        document.body.classList.add("playing");
        home.inert = true;
        home.setAttribute("aria-hidden", "true");
        backBtn.focus({ preventScroll: true });
    }

    function closeGame() {
        if (activeIndex === -1) return;

        var closedIndex = activeIndex;
        activeIndex = -1;

        player.classList.remove("open");
        player.setAttribute("aria-hidden", "true");
        document.body.classList.remove("playing");
        home.inert = false;
        home.removeAttribute("aria-hidden");

        frameShell.classList.remove("loaded");
        destroyFrame();

        if (document.fullscreenElement) {
            document.exitFullscreen().catch(function () { /* ignore */ });
        }

        refreshBest(closedIndex);

        var focusTarget = lastFocus && document.contains(lastFocus) ? lastFocus : grid.querySelector('[data-game="' + closedIndex + '"]');
        lastFocus = null;
        if (focusTarget && focusTarget.focus) focusTarget.focus({ preventScroll: true });
    }

    backBtn.addEventListener("click", closeGame);

    restartBtn.addEventListener("click", function () {
        if (activeIndex !== -1) openGame(activeIndex);
    });

    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && activeIndex !== -1 && !document.fullscreenElement) {
            closeGame();
        }
    });

    var canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!canFullscreen) {
        fullBtn.hidden = true;
    } else {
        fullBtn.addEventListener("click", function () {
            function done() { syncFullBtn(); }
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document).then(done, done);
                } else {
                    var req = player.requestFullscreen || player.webkitRequestFullscreen;
                    var result = req.call(player);
                    if (result && result.then) result.then(done, done);
                    else done();
                }
            } catch (err) { /* ignore */ }
        });
    }

    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function syncFullBtn() {
        var on = isFullscreen();
        fullBtn.setAttribute("aria-label", on ? "Exit fullscreen" : "Enter fullscreen");
        fullBtn.title = on ? "Exit fullscreen" : "Fullscreen";
        fullBtn.innerHTML = on
            ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/></svg>'
            : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
    }

    document.addEventListener("fullscreenchange", syncFullBtn);
    document.addEventListener("webkitfullscreenchange", syncFullBtn);
})();
</script>
</body>
</html>
